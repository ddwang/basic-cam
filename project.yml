name: SuperBasicCam
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    # Change this to your Apple Developer team. Xcode > Settings > Accounts shows the ID.
    DEVELOPMENT_TEAM: SG2DLSY6DA
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
targets:
  SuperBasicCam:
    type: application
    platform: macOS
    sources:
      - SuperBasicCam
      - Shared
    settings:
      base:
        PRODUCT_NAME: SuperBasicCam
        PRODUCT_BUNDLE_IDENTIFIER: com.ddwang.SuperBasicCam
        INFOPLIST_FILE: SuperBasicCam/Info.plist
        CODE_SIGN_ENTITLEMENTS: SuperBasicCam/SuperBasicCam.entitlements
    dependencies:
      - target: SuperBasicCamExtension
        embed: true
        codeSign: true
  SuperBasicCamExtension:
    type: system-extension
    platform: macOS
    sources:
      - SuperBasicCamExtension
      - Shared
    settings:
      base:
        PRODUCT_NAME: com.ddwang.SuperBasicCam.Extension
        PRODUCT_BUNDLE_IDENTIFIER: com.ddwang.SuperBasicCam.Extension
        INFOPLIST_FILE: SuperBasicCamExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SuperBasicCamExtension/SuperBasicCamExtension.entitlements
